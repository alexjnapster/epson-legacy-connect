name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run core checks
        run: swift run PrinterCoreChecks
      - name: Build application
        run: bash build-app.sh /private/tmp/Epson-Legacy-Connect.app
      - name: Verify bundle and Ukrainian resources
        run: |
          codesign --verify --deep --strict /private/tmp/Epson-Legacy-Connect.app
          plutil -lint /private/tmp/Epson-Legacy-Connect.app/Contents/Resources/uk.lproj/Localizable.strings
